<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23a5c6f4'/%3E%3Ctext x='5' y='23' font-size='20' font-family='sans-serif' font-weight='bold' fill='%2314243b'%3Ekb%3C/text%3E%3C/svg%3E"><title>KB 工作台 · 轨迹设计预览</title><link rel="stylesheet" href="prototype.css"></head>
<body>
<a class="skip" href="#collection">跳到收藏</a>
<header class="topbar"><div class="brand-area"><button id="nav-toggle" class="icon-button" aria-label="折叠分组栏" aria-expanded="true"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button><a class="brand" href="index.html"><span class="brand-mark">kb.</span><span>我的工作台</span></a></div><span class="top-hint">把常用的世界，放在手边。</span><div class="top-actions"><button id="theme-toggle" class="icon-button" aria-label="切换浅色主题"><svg viewBox="0 0 24 24"><path d="M20 14a8 8 0 1 1-10-10 7 7 0 0 0 10 10Z"/></svg></button><button id="knowledge-button" class="quiet-button"><svg viewBox="0 0 24 24"><path d="M4 4h6a3 3 0 0 1 3 3v14a4 4 0 0 0-4-3H4V4Zm16 0h-4a3 3 0 0 0-3 3m0 14a4 4 0 0 1 4-3h3V4Z"/></svg><span>知识库</span></button><button id="settings-button" class="icon-button" aria-label="设置"><svg viewBox="0 0 24 24"><path d="m10 3-.7 2.3-2 .9-2.2-.5-2 3.4 1.5 1.8v2.3L3.1 15l2 3.4 2.2-.5 2 .9.7 2.2h4l.7-2.2 2-.9 2.2.5 2-3.4-1.5-1.8v-2.3l1.5-1.8-2-3.4-2.2.5-2-.9L14 3Z"/><circle cx="12" cy="12" r="3"/></svg></button></div></header>
<div class="workspace">
<aside class="sidebar" aria-label="分组导航"><div class="sidebar-caption"><span>收藏分组</span><button id="new-group" class="mini-button" aria-label="新建分组">＋</button></div><nav id="group-nav"></nav><div class="sidebar-bottom"><span class="status-dot"></span><span>本机收藏已保存</span><button id="sync-details" aria-label="查看备份与同步">↗</button></div></aside>
<main>
<section class="hero" aria-label="搜索与时间"><div class="orbital" aria-hidden="true"></div><div class="time-row"><time id="clock">19:24</time><div class="date-copy"><span id="date">10 月 22 日，星期四</span><span>留一点空间，给新的想法。</span></div></div><form id="search-form" class="search-box"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="search" type="search" placeholder="搜索收藏，或探索网络" aria-label="搜索收藏" autocomplete="off"><button id="clear-search" type="button" class="mini-button" aria-label="清空搜索" hidden>×</button><kbd>/</kbd><button type="submit" class="search-submit">网页搜索 <span>↗</span></button></form></section>
<section id="collection" class="collection" tabindex="-1"><div class="collection-bar"><div class="heading"><button id="back-button" class="back-button" hidden aria-label="返回全部收藏">←</button><div><h1 id="view-title">全部收藏</h1><p id="view-caption">按分组安放，每次打开都从容一点。</p></div></div><div class="collection-actions"><span id="item-count" class="count">15 个分组</span><button id="compact-toggle" class="icon-button" aria-label="切换紧凑视图" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><button id="tools-button" class="quiet-button" popovertarget="tools-menu" aria-label="收藏工具"><svg viewBox="0 0 24 24"><path d="M4 6h7m4 0h5M4 12h2m4 0h10M4 18h10m4 0h2"/><circle cx="13" cy="6" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="16" cy="18" r="2"/></svg><span>工具</span><span class="chevron">⌄</span></button><button id="add-site" class="primary">＋ 添加网站</button></div></div><div id="content-scroll" class="content-scroll"><div id="content"></div><div id="empty" class="empty" hidden><span>⌕</span><h2>没有找到匹配的收藏</h2><p>换个关键词，或按 Enter 搜索网页。</p></div></div></section>
<footer><span id="footer-count">15 个分组 · 91 个收藏</span><span class="prototype-note">交互预览 · 演示数据，不连接你的收藏与 NAS</span><button id="motion-note">动效规范</button></footer>
</main></div>
<div id="tools-menu" class="menu" popover="auto"><span class="menu-heading">收藏维护</span><button data-open="check"><span>网站可用性检查</span><small>单独列出异常与待复核</small></button><button data-open="icons"><span>批量获取图标</span><small>手动获取，固定保存在本机</small></button><div class="menu-divider"></div><button data-open="backup"><span>备份与恢复</span><small>先预览，再确认恢复</small></button></div>
<dialog id="panel" closedby="any" aria-labelledby="panel-title"><div class="panel-header"><div><p id="panel-subtitle"></p><h2 id="panel-title"></h2></div><button id="close-panel" class="icon-button" aria-label="关闭面板">×</button></div><div id="panel-content" class="panel-content"></div><div id="panel-footer" class="panel-footer"></div></dialog>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script type="module" src="prototype.mjs"></script>
</body></html>
